services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-react-activity:local
    container_name: jenkins-react-activity
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"

volumes:
  jenkins_home:
